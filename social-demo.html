<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA CUTS — Social Profile Demo</title>
  <meta name="description" content="NOVA CUTS is a fictional barbershop concept created for portfolio demonstration purposes.">
  <meta name="theme-color" content="#0d0d11">
  
  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c5a059' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='6' cy='6' r='3'/><circle cx='6' cy='18' r='3'/><line x1='20' y1='4' x2='8.12' y2='15.88'/><line x1='14.47' y1='14.48' x2='20' y2='20'/><line x1='8.12' y1='8.12' x2='12' y2='12'/></svg>">

  <!-- Google Fonts: Cinzel & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <style>
    /* Dedicated Social Demo Page Styles */
    .social-demo-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: var(--bg-darkest);
      position: relative;
      overflow-x: hidden;
    }

    .social-demo-header {
      padding: 24px 0;
      border-bottom: 1px solid var(--bg-card-border);
    }

    .social-demo-header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .social-demo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      flex-grow: 1;
    }

    .social-demo-card {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-lg);
      padding: 56px 44px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg), var(--shadow-gold);
      position: relative;
      animation: fadeIn 0.4s ease-out;
    }

    .social-platform-icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px auto;
      border-radius: 50%;
      background: rgba(197, 160, 89, 0.1);
      border: 1px solid var(--gold-border);
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-platform-icon-wrap svg {
      width: 40px;
      height: 40px;
    }

    .social-demo-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: var(--radius-full);
      background: rgba(197, 160, 89, 0.15);
      border: 1px solid var(--gold-border);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 18px;
    }

    .social-demo-title {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-cream);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .social-demo-handle {
      font-family: var(--font-sans);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--gold-primary);
      margin-bottom: 20px;
    }

    .social-demo-description {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 36px;
      background: rgba(255, 255, 255, 0.03);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      border: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .social-demo-actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .social-demo-actions .btn {
      width: 100%;
      max-width: 320px;
    }

    .social-demo-footer {
      padding: 24px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-subtle);
    }
  </style>
</head>
<body class="social-demo-page">

  <!-- Header -->
  <header class="social-demo-header">
    <div class="container">
      <a href="index.html" class="brand-logo" aria-label="Nova Cuts Home">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="6" cy="18" r="3"></circle>
            <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
            <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
            <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
          </svg>
        </span>
        <span class="logo-text">NOVA <span>CUTS</span></span>
      </a>
      <span class="demo-badge">PORTFOLIO DEMO</span>
    </div>
  </header>

  <!-- Main Card Container -->
  <main class="social-demo-container">
    <div class="social-demo-card">
      <div class="social-platform-icon-wrap" id="platformIconWrap" aria-hidden="true">
        <!-- SVG injected securely via JavaScript -->
      </div>
      <div class="social-demo-badge" id="demoBadge">DEMO PROFILE</div>
      <h1 class="social-demo-title" id="platformTitle">SOCIAL PROFILE</h1>
      <p class="social-demo-handle" id="platformHandle">@novacuts_demo</p>
      
      <p class="social-demo-description" id="platformDescription">
        This is a fictional social profile used for portfolio demonstration.
      </p>

      <div class="social-demo-actions">
        <a href="index.html" class="btn btn-gold">
          <span>&larr; BACK TO NOVA CUTS</span>
        </a>
        <button type="button" class="btn btn-outline" id="closeTabBtn" style="cursor: pointer;">
          Close Tab
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="social-demo-footer">
    <div class="container">
      <p>Nova Cuts is a fictional concept created for portfolio demonstration purposes.</p>
      <p style="margin-top: 4px; font-size: 0.78rem;">&copy; 2026 Nova Cuts. All rights reserved.</p>
    </div>
  </footer>

  <!-- Dynamic Platform Script -->
  <script>
    (function() {
      'use strict';

      // SVG Icons Definitions
      const icons = {
        instagram: `<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                      <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                      <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>`,
        facebook: `<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                     <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                   </svg>`,
        tiktok: `<svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
                   <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.29 0 .58.04.86.12V9.42a6.34 6.34 0 0 0-1-.08 6.34 6.34 0 1 0 6.34 6.34V8.41a8.3 8.3 0 0 0 4.91 1.6V6.75a4.85 4.85 0 0 1-1-.06z"/>
                 </svg>`,
        fallback: `<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                     <circle cx="12" cy="12" r="10"></circle>
                     <line x1="2" y1="12" x2="22" y2="12"></line>
                     <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                   </svg>`
      };

      // Safely parse URL parameter
      const params = new URLSearchParams(window.location.search);
      const rawPlatform = params.get('platform');
      const normalizedPlatform = (rawPlatform || '').trim().toLowerCase();

      // UI Elements
      const iconWrap = document.getElementById('platformIconWrap');
      const titleEl = document.getElementById('platformTitle');
      const handleEl = document.getElementById('platformHandle');
      const descEl = document.getElementById('platformDescription');
      const closeTabBtn = document.getElementById('closeTabBtn');

      // Validation and Rendering
      if (normalizedPlatform === 'instagram') {
        document.title = 'NOVA CUTS — Instagram Demo Profile';
        iconWrap.innerHTML = icons.instagram;
        titleEl.textContent = 'INSTAGRAM';
        handleEl.textContent = '@novacuts_demo';
        descEl.textContent = 'This is a fictional social profile used for portfolio demonstration.';
      } else if (normalizedPlatform === 'facebook') {
        document.title = 'NOVA CUTS — Facebook Demo Profile';
        iconWrap.innerHTML = icons.facebook;
        titleEl.textContent = 'FACEBOOK';
        handleEl.textContent = 'Nova Cuts — Demo';
        descEl.textContent = 'This is a fictional social profile used for portfolio demonstration.';
      } else if (normalizedPlatform === 'tiktok') {
        document.title = 'NOVA CUTS — TikTok Demo Profile';
        iconWrap.innerHTML = icons.tiktok;
        titleEl.textContent = 'TIKTOK';
        handleEl.textContent = '@novacuts_demo';
        descEl.textContent = 'This is a fictional social profile used for portfolio demonstration.';
      } else {
        // Fallback for unknown or missing platform parameter
        document.title = 'NOVA CUTS — Social Profile Demo';
        iconWrap.innerHTML = icons.fallback;
        titleEl.textContent = 'SOCIAL PROFILE DEMO';
        handleEl.textContent = 'Nova Cuts Demo';
        descEl.textContent = 'This is a fictional social profile used for portfolio demonstration.';
      }

      // Close tab button action
      if (closeTabBtn) {
        closeTabBtn.addEventListener('click', function() {
          window.close();
          // Fallback if browser prevents window.close(): navigate back
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 150);
        });
      }
    })();
  </script>
</body>
</html>
